services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms_app
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
    networks:
      - wms_network
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: wms_nginx
    restart: unless-stopped
    volumes:
      - ./public:/var/www/html/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/app/public:/var/www/html/public/storage
    networks:
      - wms_network
      - naikinnid_naikinnid
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: wms_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-wms}
      MYSQL_USER: ${DB_USERNAME:-wms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - wms_db_data:/var/lib/mysql
    networks:
      - wms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wms_db_data:
    driver: local

networks:
  wms_network:
    driver: bridge
  naikinnid_naikinnid:
    external: true
